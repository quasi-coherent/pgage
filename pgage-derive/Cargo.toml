[package]
name = "pgage-derive"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quasi-coherent/pgage"
authors = ["Daniel Donohue <d.michael.donohue@gmail.com>"]
rust-version = "1.94.0"
edition = "2024"

[lib]
name = "pgage_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
